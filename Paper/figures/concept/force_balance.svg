<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" fill="none">
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff7272"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6ec6ff"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ffd36f"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#74d4c1"/>
    </marker>
  </defs>

  <rect width="1120" height="620" fill="#08111f"/>

  <text x="40" y="54" fill="#f3f6fb" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">HoverDisk Force Balance</text>
  <text x="40" y="84" fill="#aebfd1" font-size="16" font-family="Arial, Helvetica, sans-serif">Sail thrust, gravity, and orbital centrifugal balance for an offset disk.</text>

  <!-- Reference structure -->
  <line x1="140.0" y1="120" x2="140.0" y2="500" stroke="#43607d" stroke-width="1.2" stroke-dasharray="6,5" opacity="0.45"/>
  <text x="150.0" y="134" fill="#6e89a4" font-size="11" font-family="Arial, Helvetica, sans-serif" opacity="0.75">rotation axis</text>

  <line x1="70" y1="400.0" x2="510" y2="400.0" stroke="#4fc3f7" stroke-width="1.0" stroke-dasharray="6,5" opacity="0.35"/>
  <text x="516" y="404.0" fill="#4fc3f7" font-size="11" font-family="Arial, Helvetica, sans-serif" opacity="0.65">equatorial plane</text>

  <line x1="85" y1="305.0" x2="505" y2="305.0" stroke="#74d4c1" stroke-width="1.0" stroke-dasharray="7,5" opacity="0.25"/>
  <text x="510" y="309.0" fill="#74d4c1" font-size="11" font-family="Arial, Helvetica, sans-serif" opacity="0.7">offset disk plane</text>

  <circle cx="140.0" cy="400.0" r="22" fill="#ffb65c"/>
  <text x="140.0" y="442.0" fill="#ffd49a" font-size="13" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">star</text>

  <circle cx="140.0" cy="305.0" r="5" fill="#74d4c1"/>
  <text x="122.0" y="289.0" fill="#74d4c1" font-size="12" font-family="Arial, Helvetica, sans-serif">offset-disk center</text>

  <line x1="140.0" y1="305.0" x2="430.0" y2="305.0" stroke="#5d748b" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.55"/>
  <text x="285.0" y="295.0" fill="#90a7bd" font-size="12" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">orbital radius ρ</text>

  <line x1="140.0" y1="400.0" x2="430.0" y2="305.0" stroke="#ffb74d" stroke-width="1.1" stroke-dasharray="5,4" opacity="0.45"/>

  <path d="M 198.0 400.0 A 58 58 0 0 0 195.1 381.9" fill="none" stroke="#ffb74d" stroke-width="1.4" opacity="0.6"/>
  <text x="182.0" y="382.0" fill="#ffb74d" font-size="14" font-family="Arial, Helvetica, sans-serif">φ</text>

  <!-- Sunlight cue -->
  <line x1="318.7" y1="354.6" x2="437.5" y2="315.6" stroke="#ffd54f" stroke-width="1.5" opacity="0.4"/>
  <line x1="314.9" y1="349.2" x2="433.7" y2="310.3" stroke="#ffd54f" stroke-width="1.5" opacity="0.4"/>
  <line x1="311.2" y1="343.9" x2="430.0" y2="305.0" stroke="#ffd54f" stroke-width="1.5" opacity="0.4"/>
  <line x1="307.5" y1="338.6" x2="426.3" y2="299.7" stroke="#ffd54f" stroke-width="1.5" opacity="0.4"/>
  <line x1="303.8" y1="333.3" x2="422.5" y2="294.4" stroke="#ffd54f" stroke-width="1.5" opacity="0.4"/>
  <text x="295.0" y="269.0" fill="#ffd54f" font-size="12" font-family="Arial, Helvetica, sans-serif" opacity="0.8">sunlight</text>

  <!-- HoverDisk element -->
  <line x1="463.3" y1="352.5" x2="396.7" y2="257.5" stroke="#9bd3ff" stroke-width="7" stroke-linecap="round"/>
  <line x1="463.3" y1="352.5" x2="396.7" y2="257.5" stroke="#e7f4ff" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  <circle cx="430.0" cy="305.0" r="4.2" fill="#ffffff"/>
  <text x="454.0" y="365.0" fill="#cfe6fb" font-size="12" font-family="Arial, Helvetica, sans-serif">HoverDisk element</text>

  <!-- Force vectors -->
  <line x1="430.0" y1="305.0" x2="472.7" y2="275.1" stroke="#6ec6ff" stroke-width="2.4" marker-end="url(#arrow-blue)" opacity="1.0"/>
  <text x="480.7" y="271.1" fill="#6ec6ff" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="600">F<tspan baseline-shift="sub" font-size="10">sail</tspan></text>
  <line x1="430.0" y1="305.0" x2="338.8" y2="334.9" stroke="#ff7272" stroke-width="2.4" marker-end="url(#arrow-red)" opacity="1.0"/>
  <text x="304.8" y="350.9" fill="#ff7272" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="600">F<tspan baseline-shift="sub" font-size="10">g</tspan></text>
  <line x1="430.0" y1="305.0" x2="478.5" y2="305.0" stroke="#ffd36f" stroke-width="2.4" marker-end="url(#arrow-gold)" opacity="1.0"/>
  <text x="486.5" y="323.0" fill="#ffd36f" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="600">F<tspan baseline-shift="sub" font-size="10">cf</tspan></text>
  <line x1="430.0" y1="305.0" x2="381.5" y2="305.0" stroke="#74d4c1" stroke-width="2.8" marker-end="url(#arrow-green)" opacity="1.0"/>
  <text x="353.5" y="295.0" fill="#74d4c1" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="600">F<tspan baseline-shift="sub" font-size="10">c</tspan></text>

  <!-- Vector construction -->
  <line x1="472.7" y1="275.1" x2="381.5" y2="305.0" stroke="#ff7272" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="338.8" y1="334.9" x2="381.5" y2="305.0" stroke="#6ec6ff" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="381.5" y1="305.0" x2="430.0" y2="305.0" stroke="#ffd36f" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.45"/>
  <text x="398.0" y="229.0" fill="#90a7bd" font-size="11" font-family="Arial, Helvetica, sans-serif" opacity="0.8">F<tspan baseline-shift="sub" font-size="8">sail</tspan> + F<tspan baseline-shift="sub" font-size="8">g</tspan> = F<tspan baseline-shift="sub" font-size="8">c</tspan></text>
  <text x="422.0" y="347.0" fill="#90a7bd" font-size="11" font-family="Arial, Helvetica, sans-serif" opacity="0.8">F<tspan baseline-shift="sub" font-size="8">sail</tspan> + F<tspan baseline-shift="sub" font-size="8">g</tspan> + F<tspan baseline-shift="sub" font-size="8">cf</tspan> = 0</text>

  <!-- Explanation panel -->
  <rect x="700" y="108" width="360" height="410" rx="16" fill="#0e1b2c" stroke="#223a53" stroke-width="1.5"/>

  <text x="724" y="142" fill="#f0f5fb" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">How to read the balance</text>

  <circle cx="728" cy="176" r="4" fill="#6ec6ff"/>
  <text x="744" y="181" fill="#6ec6ff" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="600">F<tspan baseline-shift="sub" font-size="10">sail</tspan></text>
  <text x="792" y="181" fill="#c7d5e2" font-size="13" font-family="Arial, Helvetica, sans-serif">solar-sail thrust</text>

  <circle cx="728" cy="206" r="4" fill="#ff7272"/>
  <text x="744" y="211" fill="#ff7272" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="600">F<tspan baseline-shift="sub" font-size="10">g</tspan></text>
  <text x="776" y="211" fill="#c7d5e2" font-size="13" font-family="Arial, Helvetica, sans-serif">gravity toward the star</text>

  <circle cx="728" cy="236" r="4" fill="#ffd36f"/>
  <text x="744" y="241" fill="#ffd36f" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="600">F<tspan baseline-shift="sub" font-size="10">cf</tspan></text>
  <text x="783" y="241" fill="#c7d5e2" font-size="13" font-family="Arial, Helvetica, sans-serif">centrifugal term from</text>
  <text x="783" y="259" fill="#c7d5e2" font-size="13" font-family="Arial, Helvetica, sans-serif">orbital motion</text>

  <circle cx="728" cy="266" r="4" fill="#74d4c1"/>
  <text x="744" y="271" fill="#74d4c1" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="600">F<tspan baseline-shift="sub" font-size="10">c</tspan></text>
  <text x="774" y="271" fill="#c7d5e2" font-size="13" font-family="Arial, Helvetica, sans-serif">equivalent inward</text>
  <text x="774" y="289" fill="#c7d5e2" font-size="13" font-family="Arial, Helvetica, sans-serif">centripetal demand</text>

  <line x1="722" y1="310" x2="1038" y2="310" stroke="#223a53" stroke-width="1"/>

  <text x="724" y="340" fill="#f0f5fb" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700">Co-rotating view</text>
  <text x="730" y="372" fill="#dbe6f0" font-size="16" font-family="Arial, Helvetica, sans-serif">F<tspan baseline-shift="sub" font-size="11">sail</tspan> + F<tspan baseline-shift="sub" font-size="11">g</tspan> + F<tspan baseline-shift="sub" font-size="11">cf</tspan> = 0</text>
  <text x="730" y="398" fill="#98adbf" font-size="13" font-family="Arial, Helvetica, sans-serif">The three applied terms close as a static vector polygon.</text>

  <line x1="722" y1="418" x2="1038" y2="418" stroke="#223a53" stroke-width="1"/>

  <text x="724" y="448" fill="#f0f5fb" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700">Equivalent inertial view</text>
  <text x="730" y="480" fill="#dbe6f0" font-size="16" font-family="Arial, Helvetica, sans-serif">F<tspan baseline-shift="sub" font-size="11">sail</tspan> + F<tspan baseline-shift="sub" font-size="11">g</tspan> = F<tspan baseline-shift="sub" font-size="11">c</tspan></text>
  <text x="730" y="506" fill="#98adbf" font-size="13" font-family="Arial, Helvetica, sans-serif">F<tspan baseline-shift="sub" font-size="10">c</tspan> points toward the offset-disk center and represents</text>
  <text x="730" y="526" fill="#98adbf" font-size="13" font-family="Arial, Helvetica, sans-serif">the required inward acceleration, not a separate actuator.</text>
  <text x="730" y="558" fill="#74d4c1" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="600">F<tspan baseline-shift="sub" font-size="10">c</tspan> = m · ω² · ρ</text>
  <text x="730" y="588" fill="#667a8e" font-size="11" font-family="Arial, Helvetica, sans-serif" font-style="italic">Dashed auxiliary lines show vector addition and closure.</text>

  <text x="40" y="566" fill="#6e8398" font-size="12" font-family="Arial, Helvetica, sans-serif">Conceptual meridional section; not to scale.</text>
  <text x="40" y="586" fill="#6e8398" font-size="12" font-family="Arial, Helvetica, sans-serif">Current figure intent: thrust + gravity + centrifugal closure, with the same sum read as centripetal demand toward the offset-disk center.</text>
</svg>
