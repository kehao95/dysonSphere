<rect x="600" y="120" width="360" height="420" rx="18" fill="#0e1b2c" stroke="#223a53" stroke-width="1.5"/>
<text x="624" y="158" fill="#f3f6fb" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700">Interpretation</text>
<text x="624" y="200" fill="#74d4c1" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="700">0.1°</text>
<text x="684" y="200" fill="#aebfd1" font-size="15" font-family="Arial, Helvetica, sans-serif">Entry-level low-latitude regime</text>
<text x="624" y="248" fill="#74d4c1" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="700">0.5°</text>
<text x="684" y="248" fill="#aebfd1" font-size="15" font-family="Arial, Helvetica, sans-serif">Still highly permissive</text>
<text x="624" y="296" fill="#74d4c1" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="700">1.0°</text>
<text x="684" y="296" fill="#aebfd1" font-size="15" font-family="Arial, Helvetica, sans-serif">Meaningful but tighter benchmark</text>
<text x="624" y="364" fill="#74d4c1" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="700">Trend</text>
<text x="684" y="364" fill="#aebfd1" font-size="15" font-family="Arial, Helvetica, sans-serif">σ_max ∝ 1/sin(φ) ≈ 1/φ for small φ</text>
<text x="624" y="414" fill="#f3f6fb" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Representative ideal values</text>
<text x="624" y="446" fill="#ffd36f" font-size="15" font-family="Arial, Helvetica, sans-serif">0.1°: 337.4 g/m²</text>
<text x="624" y="474" fill="#ffd36f" font-size="15" font-family="Arial, Helvetica, sans-serif">0.5°: 67.5 g/m²</text>
<text x="624" y="502" fill="#ffd36f" font-size="15" font-family="Arial, Helvetica, sans-serif">1.0°: 33.7 g/m²</text>
<text x="624" y="550" fill="#9fe4d6" font-size="14" font-family="Arial, Helvetica, sans-serif">0.1° offset ≈ 0.26 million km ≈ 41 Earth radii</text>
