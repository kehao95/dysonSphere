<text x="1070.0" y="386.0" fill="#8fa3b7" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">These points are physically tiny in angle, so the fan does not magnify them.</text>
<text x="1070.0" y="412.0" fill="#8fa3b7" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Their importance comes from the mass-per-area threshold, not from visual width.</text>
